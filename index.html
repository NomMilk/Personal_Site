        <!--Boat rider game req-->

        <script src="/Build/BoatRider.loader.js"></script>
        <script>
            document.getElementById("Boat_Rider_Game").addEventListener("click", function () {
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    // Mobile device style: fill the whole browser client area with the game canvas:
                    var meta = document.createElement("meta");
                    meta.name = "viewport";
                    meta.content =
                        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
                    document.getElementsByTagName("head")[0].appendChild(meta);
        
                    var canvas = document.querySelector("#unity-canvas");
                    canvas.style.width = "100%";
                    canvas.style.height = "100%";
                    canvas.style.position = "fixed";
        
                    document.body.style.textAlign = "left";
                }
        
                // Create Unity instance and ensure it's ready before using it
                var BoatRiderInstance;

                createUnityInstance(document.querySelector("#unity-canvas"), {
                    arguments: [],
                    dataUrl: "Build/BoatRider.data",
                    frameworkUrl: "Build/BoatRider.framework.js",
                    codeUrl: "Build/BoatRider.wasm",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "DefaultCompany",
                    productName: "BoatRider",
                    productVersion: "1.0",
                    matchWebGLToCanvasSize: false,
                }).then((instance) => {
                    // Store the instance in the variable once Unity is ready
                    BoatRiderInstance = instance;
                    console.log("Unity instance is ready!");
                }).catch((error) => {
                    console.error("Error loading Unity instance:", error);
                });

                // Function to call SendMessage after Unity is ready
                function QuitBoatRider() {
                    if (BoatRiderInstance) {
                        BoatRiderInstance.SendMessage('GameHolder', 'Quit');
                    } else {
                        console.log("Unity instance not ready yet.");
                    }
                }

                // Make the function globally available
                window.QuitBoatRider = QuitBoatRider;

            });
        </script>
